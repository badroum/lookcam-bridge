name: Build add-on image

on:
  push:
    branches: [main]
    paths: ["lookcam_bridge/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["lookcam_bridge/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check lookcam_bridge/bridge.cjs
      - run: node lookcam_bridge/test_parser.cjs

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          V=$(sed -nE 's/^version: *"?([^"]+)"?.*/\1/p' lookcam_bridge/config.yaml)
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: lookcam_bridge
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.20
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/badroum/lookcam-bridge-${{ matrix.arch }}:${{ steps.v.outputs.version }}
            ghcr.io/badroum/lookcam-bridge-${{ matrix.arch }}:latest
