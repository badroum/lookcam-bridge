name: LookCam Sync
version: "0.5.3"
slug: lookcam_sync
description: Downloads the LookCam recordings from the camera SD card to /media, locally, on a schedule
url: https://github.com/badroum/lookcam-bridge
# Prebuilt image: the Supervisor only pulls it, nothing is built on the host.
image: ghcr.io/badroum/lookcam-sync-{arch}
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
# motions: Home Assistant sends the motion time with hassio.addon_stdin
stdin: true
# fires the event lookcam_sync_mouvement once the motion segment is on the Pi
homeassistant_api: true
# host network: LAN discovery (UDP broadcast 32108) and P2P session need it
host_network: true
# pc_transfer: samba (Samba add-on) or http (built-in file server below)
# http_port: file server for the PC (list, download with resume, delete once copied), LAN only, token
map:
  - media:rw
options:
  camera_ip: 192.168.1.42
  password: ""
  interval_minutes: 60
  keep_days: 7
  max_gb: 4
  log_level: info
  download_order: oldest_first
  pc_transfer: samba
  http_port: 8099
  http_token: ""
schema:
  camera_ip: str
  password: password
  interval_minutes: int(15,1440)
  keep_days: int(1,365)
  max_gb: int(1,200)
  log_level: list(debug|info|warning|error)
  download_order: list(oldest_first|newest_first)
  pc_transfer: list(samba|http)
  http_port: port
  http_token: password
